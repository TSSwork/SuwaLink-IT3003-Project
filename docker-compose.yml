services:
  mysql:
    image: mysql/mysql-server:8.0
    container_name: suwalink-mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: suwalink_password
      MYSQL_DATABASE: suwalink_db
      MYSQL_USER: suwalink_user
      MYSQL_PASSWORD: suwalink_password
    ports:
      # Host port stays 3308 so a locally-run backend/Liquibase still works.
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-psuwalink_password"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./backend
    container_name: suwalink-backend
    restart: no
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Inside the compose network MySQL is "mysql:3306", not "localhost:3308".
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/suwalink_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: suwalink_user
      SPRING_DATASOURCE_PASSWORD: suwalink_password
      APP_UPLOAD_DIR: /app/uploads
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173
      # Override the dev defaults with a .env file next to this compose file.
      JWT_SECRET: ${JWT_SECRET:-pQZQRQOR92qxUzkwoedk1yiHfuFFtLJiQbtEhJS0gzI7R9wCtPi4QQZv2ZKbKocP}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      # Uploaded images live on disk with only metadata in MySQL, so they have
      # to survive rebuilds — and stay visible to a host-run backend too.
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: suwalink-frontend
    restart: no
    depends_on:
      - backend
    ports:
      # Must be 5500 — that's the origin the backend's CORS config allows.
      - "5500:80"
    volumes:
      # Live-edit HTML/CSS/JS without rebuilding. Drop this line for a
      # production-like run straight from the image.
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mysql_data:
