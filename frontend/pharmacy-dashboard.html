<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharmacy dashboard · SuwaLink</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components/notifications.css" />
  <link rel="stylesheet" href="assets/css/pages/pharmacy-dashboard.css" />
</head>
<body>
  <div class="md-shell">
    <header class="md-topbar">
      <a class="md-topbar__brand" href="index.html">SuwaLink</a>
      <div class="md-topbar__actions">
        <div class="notification-wrapper">
            <button id="notification-btn" class="md-btn md-btn--icon" aria-label="Notifications">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
                    <path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z"/>
                </svg>
                <span id="notification-badge" class="badge" hidden>0</span>
            </button>
            <div id="notification-dropdown" class="dropdown-menu" hidden>
                <div class="dropdown-header">
                    <h3>Notifications</h3>
                </div>
                <div class="dropdown-body" id="notification-list">
                    <p class="empty-state">No new notifications</p>
                </div>
            </div>
        </div>
        <button id="logout-btn" class="md-btn md-btn--outlined">Logout</button>
      </div>
    </header>

    <main class="md-page">
      <h1 class="md-type-headline">Pharmacy dashboard</h1>

      <div class="md-tabs" role="tablist">
        <button class="md-tab" role="tab" id="tab-profile" aria-selected="true" aria-controls="panel-profile" data-tab="profile">
          Profile
        </button>
        <button class="md-tab" role="tab" id="tab-inventory" aria-selected="false" aria-controls="panel-inventory" data-tab="inventory">
          Inventory
        </button>
        <button class="md-tab" role="tab" id="tab-prescriptions" aria-selected="false" aria-controls="panel-prescriptions" data-tab="prescriptions">
          Prescriptions
        </button>
        <button class="md-tab" role="tab" id="tab-reservations" aria-selected="false" aria-controls="panel-reservations" data-tab="reservations">
          Reservations
        </button>
      </div>

      <section id="panel-profile" role="tabpanel" aria-labelledby="tab-profile" data-panel="profile">
        <div id="loading-state">
          <div class="md-skeleton" style="height: 24px; width: 200px; margin-bottom: var(--md-space-3)"></div>
          <div class="md-skeleton" style="height: 16px; width: 320px; margin-bottom: var(--md-space-2)"></div>
          <div class="md-skeleton" style="height: 16px; width: 280px"></div>
        </div>

        <div id="error-state" class="md-banner md-banner--error" role="alert" hidden></div>

        <div id="profile-card" class="md-card md-card--flat" hidden style="max-width: 480px">
          <p class="md-type-title" id="profile-name"></p>
          <p class="md-type-body" style="color: var(--md-sys-color-on-surface-variant); margin: var(--md-space-2) 0 0">
            Licence No. <span class="md-type-mono" id="profile-licence"></span>
          </p>
          <p class="md-type-body" style="color: var(--md-sys-color-on-surface-variant); margin: var(--md-space-1) 0 0">
            <span id="profile-address"></span>
          </p>
          <p class="md-type-body-small" id="profile-verified" style="margin-top: var(--md-space-4)"></p>
        </div>
      </section>

      <section id="panel-inventory" role="tabpanel" aria-labelledby="tab-inventory" data-panel="inventory" hidden>
        <div id="inventory-error-banner" class="md-banner md-banner--error" role="alert" hidden></div>
        <div id="inventory-success-banner" class="md-banner md-banner--success" role="status" hidden></div>

        <form id="add-inventory-form" novalidate>
          <div class="md-field">
            <label class="md-field__label" for="inventory-medicine">Medicine <span class="md-field__required">*</span></label>
            <select class="md-field__input" id="inventory-medicine" name="medicineMasterId" required>
              <option value="" disabled selected>Select a medicine</option>
            </select>
            <span class="md-field__helper" data-error-for="inventory-medicine"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="inventory-price">Unit price (LKR) <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="inventory-price" name="unitPrice" type="number" min="0.01" step="0.01" required />
            <span class="md-field__helper" data-error-for="inventory-price"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="inventory-stock">Stock quantity <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="inventory-stock" name="stockQuantity" type="number" min="0" step="1" required />
            <span class="md-field__helper" data-error-for="inventory-stock"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="inventory-expiry">Expiry date <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="inventory-expiry" name="expireDate" type="date" required />
            <span class="md-field__helper" data-error-for="inventory-expiry"></span>
          </div>
          <button class="md-btn md-btn--filled" type="submit">
            <span class="md-btn__label">Add to inventory</span>
          </button>
        </form>

        <p id="inventory-empty-state" class="md-type-body" style="color: var(--md-sys-color-on-surface-variant)" hidden>
          You haven't added any medicines to your inventory yet.
        </p>
        <div id="inventory-list" class="pharmacy-dashboard__list"></div>
      </section>

      <section id="panel-prescriptions" role="tabpanel" aria-labelledby="tab-prescriptions" data-panel="prescriptions" hidden>
        <h2 class="md-type-title">Incoming requests</h2>
        <div id="prescriptions-incoming-error-banner" class="md-banner md-banner--error" role="alert" hidden></div>
        <div id="prescriptions-respond-success-banner" class="md-banner md-banner--success" role="status" hidden></div>
        <p id="prescriptions-incoming-empty-state" class="md-type-body" style="color: var(--md-sys-color-on-surface-variant)" hidden>
          No pending prescription requests right now.
        </p>
        <div id="prescriptions-incoming-list" class="pharmacy-dashboard__list"></div>

        <h2 class="md-type-title" style="margin-top: var(--md-space-8)">My responses</h2>
        <div id="prescriptions-my-responses-error-banner" class="md-banner md-banner--error" role="alert" hidden></div>
        <p id="prescriptions-my-responses-empty-state" class="md-type-body" style="color: var(--md-sys-color-on-surface-variant)" hidden>
          You haven't responded to any prescription requests yet.
        </p>
        <div id="prescriptions-my-responses-list" class="pharmacy-dashboard__list"></div>
      </section>

      <section id="panel-reservations" role="tabpanel" aria-labelledby="tab-reservations" data-panel="reservations" hidden>
        <div id="reservations-error-banner" class="md-banner md-banner--error" role="alert" hidden></div>
        <p id="reservations-empty-state" class="md-type-body" style="color: var(--md-sys-color-on-surface-variant)" hidden>
          No reservations yet.
        </p>
        <div id="reservations-list" class="pharmacy-dashboard__list"></div>
      </section>
    </main>
  </div>

  <script type="module" src="assets/js/pages/pharmacyDashboardPage.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="module" src="assets/js/notification.js"></script>
</body>
</html>
