<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin dashboard · SuwaLink</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components/notifications.css" />
  <link rel="stylesheet" href="assets/css/pages/admin-dashboard.css" />
</head>
<body>
  <div class="md-shell">
    <header class="md-topbar">
      <a class="md-topbar__brand" href="index.html">SuwaLink</a>
      <div class="md-topbar__actions">
        <div class="notification-wrapper">
          <button id="notification-btn" class="md-btn md-btn--icon" aria-label="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z"/>
            </svg>
            <span id="notification-badge" class="badge" hidden>0</span>
          </button>
          <div id="notification-dropdown" class="dropdown-menu" hidden>
            <div class="dropdown-header">
              <h3>Notifications</h3>
            </div>
            <div class="dropdown-body" id="notification-list">
              <p class="empty-state">No new notifications</p>
            </div>
          </div>
        </div>
        <button id="logout-btn" class="md-btn md-btn--outlined">Logout</button>
      </div>
    </header>

    <main class="md-page">
      <h1 class="md-type-headline">Admin dashboard</h1>

      <div class="md-tabs" role="tablist">
        <button class="md-tab" role="tab" id="tab-dashboard" aria-selected="true" aria-controls="panel-dashboard" data-tab="dashboard">
          Dashboard
        </button>
        <button class="md-tab" role="tab" id="tab-pharmacies" aria-selected="false" aria-controls="panel-pharmacies" data-tab="pharmacies">
          Pharmacies
        </button>
        <button class="md-tab" role="tab" id="tab-users" aria-selected="false" aria-controls="panel-users" data-tab="users">
          Users
        </button>
      </div>

      <section id="panel-dashboard" role="tabpanel" aria-labelledby="tab-dashboard" data-panel="dashboard">
        <div id="dashboard-error-banner" class="md-banner md-banner--error" role="alert" hidden></div>
        <div class="admin-stats">
          <div class="md-card admin-stat-card">
            <p class="md-type-label">Total Customers</p>
            <p class="admin-stat-card__value" id="stat-customers">—</p>
          </div>
          <div class="md-card admin-stat-card">
            <p class="md-type-label">Total Pharmacies</p>
            <p class="admin-stat-card__value" id="stat-pharmacies">—</p>
          </div>
          <div class="md-card admin-stat-card">
            <p class="md-type-label">Verified Pharmacies</p>
            <p class="admin-stat-card__value" id="stat-verified">—</p>
          </div>
          <div class="md-card admin-stat-card">
            <p class="md-type-label">Pending Pharmacies</p>
            <p class="admin-stat-card__value" id="stat-pending">—</p>
          </div>
          <div class="md-card admin-stat-card">
            <p class="md-type-label">Rejected Pharmacies</p>
            <p class="admin-stat-card__value" id="stat-rejected">—</p>
          </div>
        </div>
      </section>

      <section id="panel-pharmacies" role="tabpanel" aria-labelledby="tab-pharmacies" data-panel="pharmacies" hidden>
        <div id="pharmacies-error-banner" class="md-banner md-banner--error" role="alert" hidden></div>
        <p id="pharmacies-empty-state" class="md-type-body" style="color: var(--md-sys-color-on-surface-variant)" hidden>
          No pharmacies registered yet.
        </p>
        <div id="pharmacies-list" class="admin-dashboard__list"></div>
      </section>

      <section id="panel-users" role="tabpanel" aria-labelledby="tab-users" data-panel="users" hidden>
        <div id="users-error-banner" class="md-banner md-banner--error" role="alert" hidden></div>
        <p id="users-empty-state" class="md-type-body" style="color: var(--md-sys-color-on-surface-variant)" hidden>
          No users found.
        </p>
        <div id="users-list" class="admin-dashboard__list"></div>
      </section>
    </main>
  </div>

  <script type="module" src="assets/js/pages/adminDashboardPage.js"></script>
  <script src="assets/js/notification.js"></script>
</body>
</html>
