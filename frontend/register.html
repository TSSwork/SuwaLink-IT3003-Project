<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create your account · SuwaLink</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div class="md-shell">
    <header class="md-topbar">
      <a class="md-topbar__brand" href="index.html">SuwaLink</a>
    </header>

    <main class="md-auth-layout">
      <div class="md-auth-layout__card md-card">
        <h1 class="md-type-headline" style="margin: 0 0 var(--md-space-6)">Create your account</h1>

        <div class="md-tabs" role="tablist">
          <button class="md-tab" role="tab" id="tab-customer" aria-selected="true" aria-controls="panel-customer" data-tab="customer">
            Customer
          </button>
          <button class="md-tab" role="tab" id="tab-pharmacy" aria-selected="false" aria-controls="panel-pharmacy" data-tab="pharmacy">
            Pharmacy
          </button>
        </div>

        <div id="banner" class="md-banner md-banner--error" role="alert" hidden></div>

        <form id="customer-form" role="tabpanel" aria-labelledby="tab-customer" data-panel="customer" novalidate>
          <div class="md-field">
            <label class="md-field__label" for="customer-name">Name <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="customer-name" name="name" type="text" autocomplete="name" required />
            <span class="md-field__helper" data-error-for="customer-name"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="customer-email">Email <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="customer-email" name="email" type="email" autocomplete="email" required />
            <span class="md-field__helper" data-error-for="customer-email"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="customer-phone">Phone <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="customer-phone" name="phone" type="tel" autocomplete="tel" required />
            <span class="md-field__helper" data-error-for="customer-phone"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="customer-password">Password <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="customer-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <span class="md-field__helper" data-error-for="customer-password">At least 8 characters</span>
          </div>
          <button class="md-btn md-btn--filled md-btn--full" type="submit">
            <span class="md-btn__label">Create account</span>
          </button>
        </form>

        <form id="pharmacy-form" role="tabpanel" aria-labelledby="tab-pharmacy" data-panel="pharmacy" novalidate hidden>
          <div class="md-field">
            <label class="md-field__label" for="pharmacy-name">Pharmacy name <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="pharmacy-name" name="name" type="text" autocomplete="organization" required />
            <span class="md-field__helper" data-error-for="pharmacy-name"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="pharmacy-email">Email <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="pharmacy-email" name="email" type="email" autocomplete="email" required />
            <span class="md-field__helper" data-error-for="pharmacy-email"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="pharmacy-phone">Phone <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="pharmacy-phone" name="phone" type="tel" autocomplete="tel" required />
            <span class="md-field__helper" data-error-for="pharmacy-phone"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="pharmacy-licence">Licence number <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="pharmacy-licence" name="licenceNo" type="text" required />
            <span class="md-field__helper" data-error-for="pharmacy-licence"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="pharmacy-address">Address <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="pharmacy-address" name="address" type="text" autocomplete="street-address" required />
            <span class="md-field__helper" data-error-for="pharmacy-address"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="pharmacy-password">Password <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="pharmacy-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <span class="md-field__helper" data-error-for="pharmacy-password">At least 8 characters</span>
          </div>
          <button class="md-btn md-btn--filled md-btn--full" type="submit">
            <span class="md-btn__label">Register pharmacy</span>
          </button>
        </form>

        <p class="md-type-body-small" style="margin-top: var(--md-space-6)">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/pages/registerPage.js"></script>
</body>
</html>
