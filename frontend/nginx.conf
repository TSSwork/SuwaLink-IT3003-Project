server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dev stack: the html/ dir is bind-mounted, so never let the browser cache
    # a stale page after an edit.
    add_header Cache-Control "no-store" always;

    # The dev bind-mount exposes the whole frontend/ dir, build files included.
    location ~* ^/(Dockerfile|nginx\.conf|\.dockerignore) {
        deny all;
    }

    # Allow "/login" as well as "/login.html".
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
