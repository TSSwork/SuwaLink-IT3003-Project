<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password · SuwaLink</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div class="md-shell">
    <header class="md-topbar">
      <a class="md-topbar__brand" href="index.html">SuwaLink</a>
    </header>

    <main class="md-auth-layout">
      <div class="md-auth-layout__card md-card">
        <h1 class="md-type-headline" style="margin: 0 0 var(--md-space-6)">Reset password</h1>
        <p class="md-type-body-small" style="margin: 0 0 var(--md-space-6)">
          Enter the code we emailed you along with a new password.
        </p>

        <div id="notice-banner" class="md-banner md-banner--notice" role="status" hidden></div>
        <div id="error-banner" class="md-banner md-banner--error" role="alert" hidden></div>

        <form id="reset-password-form" novalidate>
          <div class="md-field">
            <label class="md-field__label" for="email">Email <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="email" name="email" type="email" autocomplete="email" required />
            <span class="md-field__helper" data-error-for="email"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="otp">6-digit code <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required />
            <span class="md-field__helper" data-error-for="otp"></span>
          </div>
          <div class="md-field">
            <label class="md-field__label" for="newPassword">New password <span class="md-field__required">*</span></label>
            <input class="md-field__input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required />
            <span class="md-field__helper" data-error-for="newPassword">At least 8 characters</span>
          </div>
          <button class="md-btn md-btn--filled md-btn--full" type="submit">
            <span class="md-btn__label">Reset password</span>
          </button>
        </form>

        <p class="md-type-body-small" style="margin-top: var(--md-space-6)">
          <a href="forgot-password.html">Didn't get a code? Send again</a>
        </p>
      </div>
    </main>
  </div>

  <script type="module" src="assets/js/pages/resetPasswordPage.js"></script>
</body>
</html>
