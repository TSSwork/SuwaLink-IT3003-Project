# English (default). Keys mirror the stable API error codes (error.<code lowercase>).
error.validation_failed=Validation failed
error.malformed_request=Malformed or invalid request body
error.invalid_parameter=Invalid value for a request parameter
error.not_found=The requested item was not found
error.access_denied=You don't have permission to perform this action
error.unauthenticated=Invalid email or password
error.duplicate=This item already exists
error.email_taken=This email address is already registered
error.pharmacy_not_verified=Your pharmacy has not been verified yet
error.demo_disabled=Demo accounts are currently disabled
error.insufficient_stock=Not enough stock available
error.item_unavailable=This item is no longer available
error.request_closed=This prescription request is closed and no longer accepting responses
error.no_pharmacies_in_scope=No verified pharmacies were found in the selected area
error.reservation_state=This reservation can no longer be changed
error.concurrent_update=This item was just updated by someone else. Please try again.
error.internal_error=Something went wrong. Please try again.
error.data_conflict=This action can't be completed because related data still references it
