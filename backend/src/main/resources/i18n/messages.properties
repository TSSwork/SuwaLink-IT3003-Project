# English (default). Keys mirror the stable API error codes (error.<code lowercase>).
error.validation_failed=Validation failed
error.malformed_request=Malformed or invalid request body
error.invalid_parameter=Invalid value for a request parameter
error.not_found=The requested item was not found
error.access_denied=You don't have permission to perform this action
error.unauthenticated=Invalid email or password
error.duplicate=This item already exists
error.email_taken=This email address is already registered
error.pharmacy_not_verified=Your pharmacy has not been verified yet
error.demo_disabled=Demo accounts are currently disabled
error.insufficient_stock=Not enough stock available
error.item_unavailable=This item is no longer available
error.request_closed=This prescription request is closed and no longer accepting responses
error.no_pharmacies_in_scope=No verified pharmacies were found in the selected area
error.reservation_state=This reservation can no longer be changed
error.concurrent_update=This item was just updated by someone else. Please try again.
error.internal_error=Something went wrong. Please try again.
error.data_conflict=This action can't be completed because related data still references it

# Notifications: notify.<event>.title / .body; {name} placeholders are filled from the stored params.
notify.pharmacy.registered.title=New pharmacy registration
notify.pharmacy.registered.body={pharmacy} has registered and is waiting for review.
notify.pharmacy.approved.title=Pharmacy approved
notify.pharmacy.approved.body=Your pharmacy {pharmacy} has been verified. You can now manage your stock and respond to requests.
notify.pharmacy.rejected.title=Pharmacy application not approved
notify.pharmacy.rejected.body=Your application for {pharmacy} was reviewed and was not approved.
notify.prescription.sent.title=Prescription request sent
notify.prescription.sent.body=Your prescription request was sent to pharmacies near you ({count} total). We'll let you know when they respond.
notify.prescription.new.title=New prescription request
notify.prescription.new.body=A customer near you has sent a prescription request. Open it to respond.
notify.prescription.responded.title=A pharmacy responded
notify.prescription.responded.body={pharmacy} has responded to your prescription request.
notify.prescription.response-updated.title=A pharmacy updated its response
notify.prescription.response-updated.body={pharmacy} has updated its response to your prescription request.
notify.prescription.expired.title=Prescription request expired
notify.prescription.expired.body=Your prescription request has expired and no longer accepts responses.
notify.reservation.confirmed.title=Reservation confirmed
notify.reservation.confirmed.body=Your reservation of {items} at {pharmacy} is confirmed. Pickup code: {code}.
notify.reservation.new.title=New reservation
notify.reservation.new.body={customer} reserved {items}.
notify.reservation.cancelled-by-customer.title=Reservation cancelled
notify.reservation.cancelled-by-customer.body={customer} cancelled their reservation of {items}.
notify.reservation.cancelled-by-pharmacy.title=Reservation cancelled
notify.reservation.cancelled-by-pharmacy.body={pharmacy} cancelled your reservation of {items}.
notify.reservation.completed.title=Reservation completed
notify.reservation.completed.body=You collected {items} from {pharmacy}. Thank you!
notify.reservation.expired.title=Reservation expired
notify.reservation.expired.body=The reservation of {items} at {pharmacy} was not collected in time and has expired.
notify.medicine.approved.title=Medicine suggestion approved
notify.medicine.approved.body={medicine} has been added to the catalog. You can now add it to your inventory.
notify.medicine.rejected.title=Medicine suggestion not approved
notify.medicine.rejected.body=Your suggestion {medicine} was reviewed and was not added to the catalog.

# Emails
email.notification.button=Open SuwaLink
email.notification.footer=You are receiving this email because of activity on your SuwaLink account.
email.password-reset.subject=SuwaLink password reset code
email.password-reset.body=Your SuwaLink password reset code is: {otp}\n\nThis code expires in {minutes} minutes.\nIf you didn't request this, you can safely ignore this email.
error.image_purged=This prescription image has been deleted under the data retention policy
