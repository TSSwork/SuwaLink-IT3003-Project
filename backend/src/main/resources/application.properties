spring.application.name=suwalink

# MySQL (per SPECS.md; matches docker-compose.yml's mysql service)
spring.datasource.url=jdbc:mysql://localhost:3308/suwalink_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=suwalink_user
spring.datasource.password=suwalink_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase (schema is version-controlled here, not via ddl-auto)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT
# Dev-only default below (fine for local work). Real deployments MUST override via:
#   export JWT_SECRET=<your own long random secret>
app.jwt.secret=${JWT_SECRET:pQZQRQOR92qxUzkwoedk1yiHfuFFtLJiQbtEhJS0gzI7R9wCtPi4QQZv2ZKbKocP}
app.jwt.expiration-ms=86400000

# CORS (frontend runs on its own static server, a different origin)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173

# Image uploads (stored on local disk, metadata only in MySQL - see CONTEXT/SPECS.md)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail (Gmail SMTP) - used to send password reset OTPs.
# Set real values via env vars, e.g.:
#   export GMAIL_USERNAME=yourapp@gmail.com
#   export GMAIL_APP_PASSWORD=xxxxxxxxxxxxxxxx   (Google Account > Security > App passwords)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tsspredator200@gmail.com
spring.mail.password=wrnfgnvuzsrjqhzz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password reset OTP settings
