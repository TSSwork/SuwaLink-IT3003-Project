spring.application.name=suwalink
spring.profiles.default=dev

# Datasource (values come from the active profile or environment; no defaults)
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase (schema is version-controlled here, not via ddl-auto)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT (secret must be at least 32 bytes; no default)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS (frontend runs on its own static server, a different origin)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Image uploads (stored on local disk, metadata only in MySQL - see CONTEXT/SPECS.md)
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail - used to send password reset OTPs
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@suwalink.lk}

# Password reset OTP settings
app.otp.expiry-minutes=10
