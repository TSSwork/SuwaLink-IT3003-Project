spring.application.name=suwalink
spring.profiles.default=dev

# Datasource (values come from the active profile or environment; no defaults)
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase (schema is version-controlled here, not via ddl-auto)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT (secret must be at least 32 bytes; no default)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Initial admin, created on startup only if no ADMIN exists (no defaults for credentials)
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:SuwaLink Admin}

# CORS (frontend runs on its own static server, a different origin)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Image uploads (stored on local disk, metadata only in MySQL - see CONTEXT/SPECS.md)
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail - used to send password reset OTPs
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@suwalink.lk}
# Base URL for links in emails
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
# Demo users never get real mail: send to this address instead, or skip when blank
app.mail.demo-redirect=${DEMO_MAIL_REDIRECT:}

# Password reset OTP settings
app.otp.expiry-minutes=10

# Prescription requests expire this many days after creation
app.prescription.expiry-days=7
# Prescription images are deleted this many days after the request is closed or expired
# (value pending lecturer confirmation)
app.prescription.image-retention-days=30

# Scheduled jobs (expiry); disabled in tests, which call the jobs directly
app.scheduling.enabled=true

# A confirmed reservation is held for pickup this many hours
app.reservation.hold-hours=24

# Rate limiting on auth endpoints (fixed windows; see RateLimitFilter for the window lengths)
app.rate-limit.enabled=true
app.rate-limit.max-entries=100000
app.rate-limit.login.ip=10
app.rate-limit.login.email=5
app.rate-limit.register.ip=5
app.rate-limit.forgot-password.email=3
app.rate-limit.forgot-password.ip=10
app.rate-limit.reset-password.email=10

# Demo dataset (is_demo pharmacies, customers, stock): seeded on startup when missing. It stays hidden
# until an admin turns demo mode on; POST /api/admin/demo/reset recreates it.
app.demo.seed-enabled=${DEMO_SEED_ENABLED:true}
