<!DOCTYPE html>
<html>
<body style="margin:0;padding:24px;background:#f4f7f6;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr><td style="background:#0f766e;color:#ffffff;padding:16px 24px;font-size:20px;font-weight:bold;border-radius:8px 8px 0 0;">SuwaLink</td></tr>
    <tr><td style="padding:24px;">
      <h2 style="margin:0 0 12px;font-size:18px;">{{title}}</h2>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">{{body}}</p>
      <a href="{{url}}" style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:6px;font-size:15px;">{{button}}</a>
    </td></tr>
    <tr><td style="padding:16px 24px;font-size:12px;color:#6b7280;">{{footer}}</td></tr>
  </table>
</body>
</html>
