spring.datasource.url=jdbc:h2:mem:suwalink-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tests use Hibernate's own schema generation against H2; the Liquibase changelog is MySQL-specific
spring.liquibase.enabled=false

spring.h2.console.enabled=false

app.jwt.secret=Pwaq8n2jGRLpLRR+V5o1YtOTOp8zeaLECHf1iJoDYZN4URnM4RfgIuNEMRGTwiyY
app.jwt.expiration-ms=86400000

spring.mail.host=localhost
app.mail.from=test@suwalink.local
app.cors.allowed-origins=http://localhost:3000

app.admin.email=bootstrap.admin@suwalink.local
app.admin.password=test-admin-password

app.scheduling.enabled=false

# Run @Async work on the calling thread so after-commit email assertions are deterministic
app.async.synchronous=true

# Generous limits so the many logins from 127.0.0.1 across the suite never trip; RateLimitTest overrides
app.rate-limit.enabled=true
app.rate-limit.login.ip=100000
app.rate-limit.login.email=100000
app.rate-limit.register.ip=100000
app.rate-limit.forgot-password.email=100000
app.rate-limit.forgot-password.ip=100000
app.rate-limit.reset-password.email=100000

# Demo dataset is seeded on startup when missing (off in tests)
app.demo.seed-enabled=false
